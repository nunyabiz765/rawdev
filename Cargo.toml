[package]
name = "rawdev"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A RAW photo develop engine built for scripts and AI agents: JSON output, dry runs, manifests, safety guards, optional bit-exact GPU noise reduction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nunyabiz765/rawdev"
readme = "README.md"
keywords = ["raw", "photography", "libraw", "denoise", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
publish = false   # not on crates.io (yet); remove this line to publish

[dependencies]
pollster = "1.0.1"                                         # wait for one async wgpu call (block_on)
rayon = "1.12.0"                                           # data parallelism: par_iter / par_chunks
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }  # system libturbojpeg
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }  # GPU compute (Vulkan only): --gpu NLM

[profile.release]
codegen-units = 1  # slower build, a little faster code
lto = "thin"

# Tests compare against multi-megabyte reference files; build them optimised too.
[profile.test]
opt-level = 3

[features]
# Build libjpeg-turbo from source and link it statically (portable release binaries; needs cmake + nasm).
vendored-jpeg = ["turbojpeg/cmake"]
